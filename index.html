<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scroll-depth-gallery</title>
  </head>
  <body>
    <main>
      <canvas id="experience"></canvas>
      <div class="ui">
        <div class="ui__author"></div>
        <div class="ui__info info">
          <span class="info__year">0000</span>
          <h2 class="info__title">Название картины</h2>
        </div>
      </div>
      <style>
        .preloader {
          position: fixed;
          inset: 0;
          z-index: 100;
          display: grid;
          place-items: center;
          cursor: wait;
        }

        .preloader__overlay {
          position: absolute;
          z-index: 0;
          inset: 0;
          width: 100%;
          height: 100%;
        }

        .preloader__hole {
          will-change: transform;
        }

        .preloader__badge {
          position: relative;
          z-index: 1;
          overflow: hidden;
          display: grid;
          place-items: center;
          background: #f3f1ef;
          border-radius: 24px;
          min-width: 6ch;
          aspect-ratio: 16 / 9;
          font-family: 'Roboto', monospace, sans-serif;
          font-size: 4rem;
          font-weight: 400;
          will-change: transform, opacity;
        }

        .preloader__fill {
          --progress: 0;
          position: absolute;
          inset: 0;
          z-index: -1;
          background: #c8af9e;
          transform: scaleX(var(--progress));
          transform-origin: left;
        }

        .preloader__counter {
          color: #000000;
          text-align: center;
          font-variant-numeric: tabular-nums;
        }
      </style>
      <div class="preloader">
        <svg class="preloader__overlay">
          <defs>
            <mask id="preloader-mask">
              <rect width="100%" height="100%" fill="white" />

              <rect
                class="preloader__hole"
                x="0"
                y="0"
                width="0"
                height="0"
                rx="24"
                fill="black"
              />
            </mask>
          </defs>

          <rect
            width="100%"
            height="100%"
            fill="#e3dbd6"
            mask="url(#preloader-mask)"
          />
        </svg>

        <div class="preloader__badge">
          <div class="preloader__fill"></div>
          <div class="preloader__counter">0</div>
        </div>
      </div>
      <script>
        ;(() => {
          const counter = document.querySelector('.preloader__counter')
          const fill = document.querySelector('.preloader__fill')

          if (!counter || !fill) return

          const lerp = (a, b, t) => a + t * (b - a)

          const warmupTargets = [
            4 + Math.floor(Math.random() * 4),
            8 + Math.floor(Math.random() * 8),
            16 + Math.floor(Math.random() * 16),
          ]
          let targetIndex = 0
          let current = 0
          let target = warmupTargets[targetIndex]

          let rafId = null
          let timeoutId = null
          let isPaused = false

          const update = (newCurrent) => {
            current = newCurrent
            counter.textContent = current.toFixed()
            fill.style.setProperty('--progress', current / 100)
          }

          const tick = () => {
            console.log(target, targetIndex)
            if (isPaused) return

            update(lerp(current, target, 0.06))

            if (Math.abs(target - current) < 0.1) {
              update(target)

              if (targetIndex + 1 === warmupTargets.length) return

              targetIndex += 1
              isPaused = true

              timeoutId = setTimeout(() => {
                target = warmupTargets[targetIndex]
                isPaused = false
                rafId = requestAnimationFrame(tick)
              }, 250)

              return
            }

            rafId = requestAnimationFrame(tick)
          }

          rafId = requestAnimationFrame(tick)

          window.__preloaderWarmup = {
            stop() {
              if (rafId) cancelAnimationFrame(rafId)
              if (timeoutId) clearTimeout(timeoutId)
            },

            get progress() {
              return current / 100
            },
          }
        })()
      </script>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
