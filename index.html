<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scroll-depth-gallery</title>
  </head>
  <body>
    <main>
      <canvas id="experience"></canvas>
      <div class="ui">
        <div class="ui__info info">
          <span class="info__year">0000</span>
          <h2 class="info__title">Название картины</h2>
        </div>
      </div>
      <style>
        .preloader {
          position: fixed;
          inset: 0;
          z-index: 100;
          background: #c8af9e;
          display: grid;
          place-items: center;
          cursor: wait;
        }

        .preloader__columns {
          position: absolute;
          z-index: 0;
          inset: 0;
          display: flex;
        }

        .preloader__column {
          flex-grow: 1;
          background: #c8af9e;
          clip-path: inset(0% 0% 0% 0%);
          will-change: clip-path;
        }

        .preloader__counter {
          position: absolute;
          z-index: 1;
          color: #000000;
          font-family: 'Roboto', monospace, sans-serif;
          font-size: 4rem;
          font-weight: 400;
          font-variant-numeric: tabular-nums;
        }
      </style>
      <div class="preloader">
        <div class="preloader__columns"></div>
        <p class="preloader__counter">0</p>
      </div>
      <script>
        ;(() => {
          const counter = document.querySelector('.preloader__counter')
          console.log(counter)

          if (!counter) return

          const lerp = (a, b, t) => a + t * (b - a)

          const warmupTargets = [
            4 + Math.floor(Math.random() * 4),
            8 + Math.floor(Math.random() * 8),
            16 + Math.floor(Math.random() * 16),
          ]
          let targetIndex = 0
          let current = 0
          let target = warmupTargets[targetIndex]

          let rafId = null
          let timeoutId = null
          let isPaused = false

          const tick = () => {
            console.log(target, targetIndex)
            if (isPaused) return

            current = lerp(current, target, 0.06)
            counter.textContent = current.toFixed()

            if (Math.abs(target - current) < 0.1) {
              current = target
              counter.textContent = current.toFixed()

              if (targetIndex + 1 === warmupTargets.length) return

              targetIndex += 1
              isPaused = true

              timeoutId = setTimeout(() => {
                target = warmupTargets[targetIndex]
                isPaused = false
                rafId = requestAnimationFrame(tick)
              }, 300)

              return
            }

            rafId = requestAnimationFrame(tick)
          }

          rafId = requestAnimationFrame(tick)

          window.__preloaderWarmup = {
            stop() {
              if (rafId) cancelAnimationFrame(rafId)
              if (timeoutId) clearTimeout(timeoutId)
            },

            get progress() {
              return current / 100
            },
          }
        })()
      </script>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
